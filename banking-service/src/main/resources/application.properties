quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.devservices.enabled=true
%dev.quarkus.datasource.devservices.username=postgres
%dev.quarkus.datasource.devservices.password=admin
%dev.quarkus.datasource.devservices.port=5432
%dev.quarkus.datasource.devservices.db-name=minibanco

quarkus.hibernate-orm.schema-management.strategy=update
quarkus.http.root-path=/api

mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=minibanco-api
smallrye.jwt.sign.key.location=privateKey.pem

quarkus.rest-client.exchange-rate.url=https://open.er-api.com
quarkus.rest-client.exchange-rate.connect-timeout=2000
quarkus.rest-client.exchange-rate.read-timeout=3000

# En desarrollo local el broker se levanta con podman-compose (puerto 9092 del host).
%dev.kafka.bootstrap.servers=localhost:9092
%dev.quarkus.kafka.devservices.enabled=false

mp.messaging.outgoing.transfers-out.connector=smallrye-kafka
mp.messaging.outgoing.transfers-out.topic=transfers
mp.messaging.outgoing.transfers-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.transfers-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
