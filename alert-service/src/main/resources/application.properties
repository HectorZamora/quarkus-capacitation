quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.devservices.enabled=true
%dev.quarkus.datasource.devservices.username=postgres
%dev.quarkus.datasource.devservices.password=admin
%dev.quarkus.datasource.devservices.port=5433
%dev.quarkus.datasource.devservices.db-name=alertdb

quarkus.hibernate-orm.schema-management.strategy=update
quarkus.http.root-path=/api

mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=minibanco-api

# En desarrollo local el broker se levanta con podman-compose (puerto 9092 del host).
%dev.kafka.bootstrap.servers=localhost:9092
%dev.quarkus.kafka.devservices.enabled=false

mp.messaging.incoming.transfers-in.connector=smallrye-kafka
mp.messaging.incoming.transfers-in.topic=transfers
mp.messaging.incoming.transfers-in.value.deserializer=org.acme.messaging.TransferCompletedEventDeserializer
mp.messaging.incoming.transfers-in.auto.offset.reset=earliest
mp.messaging.incoming.transfers-in.group.id=minibanco-antifraud

# Canal auxiliar usado únicamente por los tests para publicar eventos en el mismo tópico.
%test.mp.messaging.outgoing.transfers-test-out.connector=smallrye-kafka
%test.mp.messaging.outgoing.transfers-test-out.topic=transfers
%test.mp.messaging.outgoing.transfers-test-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
%test.mp.messaging.outgoing.transfers-test-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
